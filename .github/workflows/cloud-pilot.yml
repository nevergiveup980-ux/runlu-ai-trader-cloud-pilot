name: RUNLU Cloud Pilot (offline simulation)
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '15 15 * * 1-5'
permissions:
  contents: read
concurrency:
  group: runlu-cloud-pilot-pages
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Test cloud pilot
        run: python -m unittest -v test_cloud_pilot
      - name: Test unchanged V5.7 snapshot
        working-directory: RUNLU_AI_TRADER_V5_7
        run: python -m unittest discover -q
  publish-demo:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Generate offline status and execution evidence
        run: |
          python cloud_pilot.py --output cloud_site
          python - <<'PY'
          import os, json, datetime
          from pathlib import Path
          evidence = {
              'repository': os.environ['GITHUB_REPOSITORY'],
              'commit': os.environ['GITHUB_SHA'],
              'run_url': 'https://github.com/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['GITHUB_RUN_ID'],
              'event': os.environ['GITHUB_EVENT_NAME'],
              'generated_at_utc': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'tests_required': True,
              'real_trading_enabled': False,
              'external_market_or_ai_api': False,
          }
          Path('cloud_site/deployment.json').write_text(json.dumps(evidence,indent=2)+'\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Offline pilot only. Tests passed before publication. No market data, AI API, broker or real trading.\n')
          PY
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: cloud_site
          retention-days: 1
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
